<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 찾기 | ICHI</title>
<meta name="description" content="㈜이치 회원 비밀번호 찾기 페이지입니다.">
<link rel="canonical" href="https://www.ichi.kr/password-reset.dc.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="㈜이치 ICHI">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="비밀번호 찾기 | ICHI">
<meta property="og:description" content="㈜이치 회원 비밀번호 찾기 페이지입니다.">
<meta property="og:url" content="https://www.ichi.kr/password-reset.dc.html">
<meta property="og:image" content="https://www.ichi.kr/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="비밀번호 찾기 | ICHI">
<meta name="twitter:description" content="㈜이치 회원 비밀번호 찾기 페이지입니다.">
<meta name="twitter:image" content="https://www.ichi.kr/assets/og-image.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<script src="./support.js"></script>
<script src="./auth.js"></script>
<script src="./common.js"></script>
</head>
<body class="subpage">
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add('js-reveal');</script>
</helmet>
<dc-import name="SiteNav" hint-size="100%,72px"></dc-import>

<section class="auth-split" data-screen-label="Password Reset">
  <aside class="auth-brand">
    <div class="circuit" aria-hidden="true">
      <svg viewBox="0 0 400 600" fill="none" preserveAspectRatio="xMidYMid slice" stroke="currentColor" stroke-width="1.4">
        <path d="M-10 90 H120 a12 12 0 0 1 12 12 V200 a12 12 0 0 0 12 12 H420"></path>
        <path d="M-10 210 H70 a12 12 0 0 0 12 -12 V70"></path>
        <path d="M410 150 H300 a12 12 0 0 0 -12 12 V320 a12 12 0 0 1 -12 12 H-10"></path>
        <path d="M60 620 V440 a12 12 0 0 1 12 -12 H240 a12 12 0 0 0 12 -12 V240"></path>
        <path d="M410 470 H210 a12 12 0 0 1 -12 -12 V330"></path>
        <path d="M150 620 V540 a12 12 0 0 1 12 -12 H420"></path>
        <circle cx="132" cy="102" r="5" fill="currentColor" stroke="none"></circle>
        <circle cx="288" cy="162" r="5" fill="currentColor" stroke="none"></circle>
        <circle cx="82" cy="70" r="5" fill="currentColor" stroke="none"></circle>
        <circle cx="198" cy="330" r="5" fill="currentColor" stroke="none"></circle>
        <circle cx="252" cy="240" r="5" fill="currentColor" stroke="none"></circle>
        <circle cx="162" cy="528" r="5" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    
  <div class="auth-card accent wide">
      <div class="auth-eye">
        <span class="eye-mono">Password Reset</span>
        <div class="eye-dash"></div>
      </div>
      <h1 class="auth-h1" style="font-weight:700;color:var(--blue)">비밀번호 찾기</h1>
      <p class="auth-sub">가입하신 이메일로 인증번호를 보내드립니다.<br>인증번호를 입력하고 새 비밀번호를 정해 주세요.</p>

      <form class="auth-form" id="reset-form" onSubmit="{{ onSubmit }}">
        <div class="fg" data-field="email">
          <label class="fl">Email <span class="ko">· 이메일</span></label>
          <div class="id-check-row">
            <input type="email" class="fi" name="email" placeholder="name@example.com" autoComplete="email">
            <button type="button" class="id-check-btn" id="send-code-btn" onClick="{{ sendCode }}">인증번호 받기</button>
          </div>
          <div class="fg-alert"></div>
        </div>

        <div class="fg verify-row" data-field="code" id="verify-block">
          <input type="text" class="fi" name="code" placeholder="메일로 받은 인증번호 6자리" maxLength="6" inputMode="numeric" autoComplete="one-time-code">
          <div class="verify-meta">
            <span class="verify-timer" id="verify-timer"></span>
            <span class="verify-hint" id="verify-hint">가입된 이메일이면 인증번호가 발송됩니다</span>
          </div>
          <div class="fg-alert"></div>
        </div>

        <div class="fg" data-field="password">
          <label class="fl">New Password <span class="ko">· 새 비밀번호</span></label>
          <div class="fi-wrap">
            <input type="password" class="fi" name="password" placeholder="영문 · 숫자 포함 8자 이상" autoComplete="new-password">
            <button type="button" class="fi-eye" onClick="{{ togglePw }}" aria-label="비밀번호 표시">
              <svg class="on-i" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="off" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
            </button>
          </div>
          <div class="fg-alert"></div>
        </div>

        <div class="fg" data-field="password2">
          <label class="fl">Confirm <span class="ko">· 새 비밀번호 확인</span></label>
          <div class="fi-wrap">
            <input type="password" class="fi" name="password2" placeholder="새 비밀번호 재입력" autoComplete="new-password">
            <button type="button" class="fi-eye" onClick="{{ togglePw }}" aria-label="비밀번호 표시">
              <svg class="on-i" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="off" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
            </button>
          </div>
          <div class="fg-alert"></div>
        </div>

        <button type="submit" class="btn-submit auth-submit" style="margin-top:6px">
          비밀번호 변경
          <span class="arrow">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="6" x2="10" y2="6"></line><polyline points="6,2 10,6 6,10"></polyline></svg>
          </span>
        </button>
      </form>

      <div class="auth-note" id="reset-note" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
        <span></span>
      </div>

      <div class="auth-alt">
        비밀번호가 기억나셨나요?
        <a href="login.dc.html">로그인</a>
      </div>
    </div></aside>

  <div class="auth-panel">
    <span class="blob" aria-hidden="true"></span>
    <div class="auth-col">
    

    <a href="ICHI Site.dc.html" class="auth-home">
      <svg viewBox="0 0 14 14"><polyline points="8.5,2.5 4,7 8.5,11.5"></polyline></svg>
      홈으로 돌아가기
    </a>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this._timer = null;
    this._sent = false;
    const form = document.getElementById('reset-form');
    if (form) {
      this._onInput = (e) => {
        const fg = e.target.closest && e.target.closest('.fg');
        if (fg) fg.classList.remove('has-error');
        const note = document.getElementById('reset-note');
        if (note) note.classList.remove('show');
      };
      form.addEventListener('input', this._onInput);
    }
  }
  componentWillUnmount() { if (this._timer) clearInterval(this._timer); }
  _form() { return document.getElementById('reset-form'); }
  _val(n) { const f = this._form(); const el = f && f.querySelector('[name="' + n + '"]'); return ((el || {}).value || '').trim(); }
  _setErr(field, msg) { const f = this._form(); const fg = f && f.querySelector('.fg[data-field="' + field + '"]'); if (!fg) return; fg.classList.add('has-error'); const a = fg.querySelector('.fg-alert'); if (a) a.textContent = msg; }
  _clearErr(field) { const f = this._form(); const fg = f && f.querySelector('.fg[data-field="' + field + '"]'); if (fg) fg.classList.remove('has-error'); }
  _startTimer() {
    if (this._timer) clearInterval(this._timer);
    let remaining = 600;
    const tEl = document.getElementById('verify-timer');
    const render = () => {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      if (tEl) { tEl.textContent = '남은 시간 ' + m + ':' + s; tEl.classList.remove('expired'); }
    };
    render();
    this._timer = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(this._timer); this._timer = null; this._sent = false;
        if (tEl) { tEl.textContent = '인증시간이 만료되었습니다. 재전송해 주세요.'; tEl.classList.add('expired'); }
        return;
      }
      render();
    }, 1000);
  }
  renderVals() {
    return {
      sendCode: () => {
        const email = this._val('email');
        if (!email) { this._setErr('email', '이메일을 입력해 주세요.'); const el = this._form().querySelector('[name="email"]'); if (el) el.focus({ preventScroll: true }); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { this._setErr('email', '올바른 이메일 형식을 입력해주세요.'); return; }
        this._clearErr('email');
        this._sent = true;
        const block = document.getElementById('verify-block'); if (block) block.classList.add('show');
        const btn = document.getElementById('send-code-btn'); if (btn) btn.textContent = '재전송';
        const ci = this._form().querySelector('[name="code"]'); if (ci) { ci.value = ''; ci.focus({ preventScroll: true }); }
        this._clearErr('code');
        this._startTimer();
      },
      onSubmit: (e) => {
        e.preventDefault();
        const form = this._form(); if (!form) return;
        form.querySelectorAll('.fg.has-error').forEach((fg) => fg.classList.remove('has-error'));
        const note = document.getElementById('reset-note'); if (note) note.classList.remove('show');
        const email = this._val('email'), code = this._val('code'), pw = this._val('password'), pw2 = this._val('password2');
        const rules = [
          ['email', !email ? '이메일을 입력해 주세요.' : (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '올바른 이메일 형식을 입력해주세요.' : '')],
          ['email', email && !this._sent && !document.getElementById('verify-block').classList.contains('show') ? '인증번호 받기를 눌러 주세요.' : ''],
          ['code', document.getElementById('verify-block').classList.contains('show') ? (!this._sent ? '인증시간이 만료되었습니다. 재전송해 주세요.' : (!/^\d{6}$/.test(code) ? '인증번호 6자리를 입력해 주세요.' : '')) : ''],
          ['password', !pw ? '새 비밀번호를 입력해 주세요.' : (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw) ? '영문 · 숫자를 포함해 8자 이상 입력해 주세요.' : '')],
          ['password2', !pw2 ? '새 비밀번호를 다시 입력해 주세요.' : (pw !== pw2 ? '비밀번호가 일치하지 않습니다.' : '')],
        ];
        let firstBad = null;
        for (const [field, msg] of rules) {
          if (msg && !(form.querySelector('.fg[data-field="' + field + '"]').classList.contains('has-error'))) {
            this._setErr(field, msg);
            if (!firstBad) firstBad = form.querySelector('.fg[data-field="' + field + '"] .fi');
          }
        }
        if (firstBad) { firstBad.focus({ preventScroll: true }); return; }
        if (this._timer) { clearInterval(this._timer); this._timer = null; }
        if (note) { note.querySelector('span').textContent = '비밀번호가 변경되었습니다. 로그인 페이지로 이동합니다…'; note.classList.add('show'); }
        setTimeout(() => { window.location.href = 'login.dc.html'; }, 1500);
      },
      togglePw: (e) => {
        const btn = e.currentTarget;
        const inp = btn.parentNode.querySelector('input');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        btn.classList.toggle('on');
      },
    };
  }
}
</script>
</body>
</html>
