<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
</helmet>
<nav class="site" id="nav" data-screen-label="Nav">
  <a href="ICHI Site.dc.html" class="logo">
    <img class="logo-mark" src="assets/img-01.png" alt="ICHI">
    <span class="divider"></span>
    <span class="tag">Smart Automation</span>
  </a>
  <div class="nav-center">
    <a href="About.dc.html" class="nl">회사소개</a>
    <a href="Business.dc.html" class="nl">사업소개</a>
    <a href="Careers.dc.html" class="nl">인재채용</a>
    <a href="Contact.dc.html" class="nl">문의하기</a>
  </div>
  <div class="nav-right">
    <a href="login.dc.html" class="nav-cta">로그인</a>
    <div class="nav-auth">
      <span class="nav-user"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><b class="nav-uname"></b></span>
      <a class="nav-admin" href="Admin.dc.html">관리자</a>
      <a class="nav-mypage" href="mypage.dc.html">마이페이지</a>
      <button class="nav-logout" type="button">로그아웃</button>
    </div>
    <button class="nav-burger" aria-label="메뉴 열기" onClick="{{ toggleMenu }}">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>

<div class="mobile-menu{{ menuOpenClass }}">
  <div class="mm-head">
    <img class="mm-logo" src="assets/img-01.png" alt="ICHI" style="height: 28px; width: auto">
    <span class="mm-head-user"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><b class="mm-uname"></b></span>
    <button class="mm-close" aria-label="메뉴 닫기" onClick="{{ toggleMenu }}">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="3" x2="15" y2="15"></line><line x1="15" y1="3" x2="3" y2="15"></line></svg>
    </button>
  </div>
  <div class="mm-links">
    <a href="About.dc.html" class="mm-link" onClick="{{ closeMenu }}">회사소개</a>
    <a href="Business.dc.html" class="mm-link" onClick="{{ closeMenu }}">사업소개</a>
    <a href="Careers.dc.html" class="mm-link" onClick="{{ closeMenu }}">인재채용</a>
    <a href="Contact.dc.html" class="mm-link" onClick="{{ closeMenu }}">문의하기</a>
  </div>
  <a href="login.dc.html" class="mm-cta" onClick="{{ closeMenu }}">
    로그인
    <span class="arrow">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="6" x2="10" y2="6"></line><polyline points="6,2 10,6 6,10"></polyline></svg>
    </span>
  </a>
  <div class="mm-auth">
    <span class="mm-user"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><b class="mm-uname"></b></span>
    <a class="mm-admin" href="Admin.dc.html" onClick="{{ closeMenu }}">관리자 페이지</a>
    <a class="mm-mypage" href="mypage.dc.html" onClick="{{ closeMenu }}">마이페이지</a>
    <button class="mm-logout" type="button">로그아웃</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };
  componentDidMount() {
    const nav = document.getElementById('nav');
    this._onScroll = () => { if (nav) nav.classList.toggle('solid', window.scrollY > 80); };
    window.addEventListener('scroll', this._onScroll);
    this._onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
  }
  renderVals() {
    return {
      menuOpenClass: this.state.menuOpen ? ' open' : '',
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
