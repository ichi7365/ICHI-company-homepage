<section class="auth-split" data-screen-label="Signup">
  

  <div class="auth-panel">
    <span class="blob" aria-hidden="true"></span>
    <div class="auth-col">
    

    <div class="auth-card accent wide">
      <div class="auth-eye">
        <span class="eye-mono">Create Account</span>
        <div class="eye-dash"></div>
      </div>
      <h1 class="auth-h1" style="font-weight:700;color:var(--blue)">회원가입</h1>
      <p class="auth-sub">파트너 · 임직원 계정을 생성합니다. 정확한 정보를 입력해 주세요.</p>

      <form class="auth-form" id="signup-form" onSubmit="{{ onSubmit }}">
        <div class="fg-row">
          <div class="fg" data-field="name">
            <label class="fl">Name <span class="ko">· 이름</span></label>
            <input type="text" class="fi" name="name" placeholder="이름">
            <div class="fg-alert"></div>
          </div>
          <div class="fg" data-field="birth">
            <label class="fl">Birth <span class="ko">· 생년월일</span></label>
            <input type="date" class="fi" name="birth">
            <div class="fg-alert"></div>
          </div>
        </div>

        <div class="fg" data-field="gender">
          <label class="fl">Gender <span class="ko">· 성별</span></label>
          <div class="gender-opts">
            <label class="gender-opt"><input type="radio" name="gender" value="남성"><span>남성</span></label>
            <label class="gender-opt"><input type="radio" name="gender" value="여성"><span>여성</span></label>
          </div>
          <div class="fg-alert"></div>
        </div>

        <div class="fg" data-field="phone">
          <label class="fl">Phone <span class="ko">· 연락처</span></label>
          <div class="id-check-row">
            <input type="tel" class="fi" name="phone" placeholder="010-1234-5678" autoComplete="tel">
            <button type="button" class="id-check-btn" id="send-code-btn" onClick="{{ sendCode }}">인증번호 받기</button>
          </div>
          <div class="fg-alert"></div>
        </div>

        <div class="fg verify-row" data-field="code" id="verify-block">
          <div class="id-check-row">
            <input type="text" class="fi" name="code" placeholder="인증번호 6자리" maxLength="6" inputMode="numeric" autoComplete="one-time-code">
            <button type="button" class="id-check-btn" id="verify-btn" onClick="{{ verifyCode }}">인증하기</button>
          </div>
          <div class="verify-meta">
            <span class="verify-timer" id="verify-timer"></span>
            <span class="verify-hint" id="verify-hint"></span>
          </div>
          <div class="fg-alert"></div>
        </div>

        <div class="verify-done" id="verify-done" role="status" aria-live="polite">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
          <span>인증이 완료되었습니다.</span>
        </div>

        <div class="fg" data-field="email">
          <label class="fl">Email <span class="ko">· 이메일</span></label>
          <input type="email" class="fi" name="email" placeholder="name@example.com" autoComplete="email">
          <div class="fg-alert"></div>
        </div>

        <div class="fg" data-field="userid">
          <label class="fl">ID <span class="ko">· 아이디</span></label>
          <div class="id-check-row">
            <input type="text" class="fi" name="userid" placeholder="사용할 아이디를 입력해 주세요" autoComplete="username">
            <button type="button" class="id-check-btn" onClick="{{ checkId }}">중복 확인</button>
          </div>
          <div class="id-check-msg" id="id-check-msg"></div>
          <div class="fg-alert"></div>
        </div>
        <div class="fg-row">
          <div class="fg" data-field="password">
            <label class="fl">Password <span class="ko">· 비밀번호</span></label>
            <input type="password" class="fi" name="password" placeholder="비밀번호" autoComplete="new-password">
            <div class="pw-strength" id="pw-strength" aria-hidden="true">
              <div class="pw-bars"><span></span><span></span><span></span></div>
              <span class="pw-label"></span>
            </div>
            <div class="fg-alert"></div>
          </div>
          <div class="fg" data-field="password2">
            <label class="fl">Confirm <span class="ko">· 비밀번호 확인</span></label>
            <input type="password" class="fi" name="password2" placeholder="비밀번호 재입력" autoComplete="new-password">
            <div class="fg-alert"></div>
          </div>
        </div>

        <div class="terms-group">
          <label class="auth-check terms terms-all">
            <input type="checkbox" name="agreeAll">
            <span class="box"><svg viewBox="0 0 12 12"><polyline points="2,6.5 5,9 10,3.5"></polyline></svg></span>
            <span>전체 동의</span>
          </label>
          <div class="terms-divider"></div>
          <div class="terms-item">
            <label class="auth-check terms">
              <input type="checkbox" name="agree1">
              <span class="box"><svg viewBox="0 0 12 12"><polyline points="2,6.5 5,9 10,3.5"></polyline></svg></span>
              <span><span class="req">(필수)</span> 이용약관 동의</span>
            </label>
            <button type="button" class="terms-view" data-term="service" onClick="{{ openTerms }}">전문보기</button>
          </div>
          <div class="terms-item">
            <label class="auth-check terms">
              <input type="checkbox" name="agree2">
              <span class="box"><svg viewBox="0 0 12 12"><polyline points="2,6.5 5,9 10,3.5"></polyline></svg></span>
              <span><span class="req">(필수)</span> 개인정보 수집·이용 동의</span>
            </label>
            <button type="button" class="terms-view" data-term="collect" onClick="{{ openTerms }}">전문보기</button>
          </div>
          <div class="terms-item">
            <label class="auth-check terms">
              <input type="checkbox" name="agree3">
              <span class="box"><svg viewBox="0 0 12 12"><polyline points="2,6.5 5,9 10,3.5"></polyline></svg></span>
              <span><span class="req">(필수)</span> 개인정보 제3자 제공 동의</span>
            </label>
            <button type="button" class="terms-view" data-term="thirdparty" onClick="{{ openTerms }}">전문보기</button>
          </div>
        </div>
        <div class="terms-alert" id="agree-alert">필수 약관에 모두 동의해 주세요.</div>

        <button type="submit" class="btn-submit auth-submit" id="signup-btn" style="margin-top:6px">
          회원가입
          <span class="arrow">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="6" x2="10" y2="6"></line><polyline points="6,2 10,6 6,10"></polyline></svg>
          </span>
        </button>
        <div class="auth-helper" id="signup-helper">모든 항목을 입력하고 연락처 인증을 완료해 주세요.</div>
      </form>

      <div class="auth-note" id="signup-note" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
        <span></span>
      </div>

      <div class="auth-alt">
        이미 계정이 있으신가요?
        <a href="login.dc.html">로그인</a>
      </div>
    </div><a href="ICHI Site.dc.html" class="auth-home">
      <svg viewBox="0 0 14 14"><polyline points="8.5,2.5 4,7 8.5,11.5"></polyline></svg>
      홈으로 돌아가기
    </a>
    </div>
  </div>

  <div class="terms-modal" id="terms-modal" role="dialog" aria-modal="true" aria-labelledby="terms-modal-title">
    <div class="terms-modal-backdrop" onClick="{{ closeTerms }}"></div>
    <div class="terms-modal-card">
      <div class="terms-modal-head">
        <div>
          <span class="terms-modal-eye">Terms & Policy</span>
          <h3 id="terms-modal-title"></h3>
        </div>
        <button type="button" class="terms-modal-close" onClick="{{ closeTerms }}" aria-label="닫기">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="3" x2="15" y2="15"></line><line x1="15" y1="3" x2="3" y2="15"></line></svg>
        </button>
      </div>
      <div class="terms-modal-body" id="terms-modal-body"></div>
      <div class="terms-modal-foot">
        <button type="button" class="terms-modal-cancel" onClick="{{ closeTerms }}">닫기</button>
        <button type="button" class="terms-agree-btn" onClick="{{ agreeFromModal }}">동의하고 닫기</button>
      </div>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };
  componentDidMount() {
    this._checkedId = null;
    this._phoneVerified = false;
    this._genCode = null;
    this._timer = null;
    const form = document.getElementById('signup-form');
    if (form) {
      this._onInput = (e) => {
        const fg = e.target.closest && e.target.closest('.fg');
        if (fg) fg.classList.remove('has-error');
        if (['agree1', 'agree2', 'agree3'].includes(e.target.name)) { this._syncAgreeAll(); const ta = document.getElementById('agree-alert'); if (ta) ta.classList.remove('show'); }
        if (e.target.name === 'agreeAll') { this._applyAgreeAll(e.target.checked); const ta = document.getElementById('agree-alert'); if (ta) ta.classList.remove('show'); }
        const note = document.getElementById('signup-note'); if (note) note.classList.remove('show');
        if (e.target.name === 'password') this._updatePwStrength(e.target.value);
        if (e.target.name === 'userid') {
          this._checkedId = null;
          const m = document.getElementById('id-check-msg'); if (m) m.classList.remove('show', 'ok', 'taken');
        }
        if (e.target.name === 'phone') this._resetVerification();
        if (e.target.name === 'gender') this._clearFieldErr('gender');
        this._updateSubmitState();
      };
      this._onBlur = (e) => {
        const fields = ['name', 'birth', 'phone', 'email', 'userid', 'password', 'password2'];
        if (e.target && fields.includes(e.target.name)) this._validateField(e.target.name);
      };
      form.addEventListener('input', this._onInput);
      form.addEventListener('change', this._onInput);
      form.addEventListener('focusout', this._onBlur);
    }
    this._updateSubmitState();
  }
  componentWillUnmount() {
    if (this._timer) clearInterval(this._timer);
  }
  _val(n) { const f = document.getElementById('signup-form'); const el = f && f.querySelector('[name="' + n + '"]'); return ((el || {}).value || '').trim(); }
  _gender() { const f = document.getElementById('signup-form'); const el = f && f.querySelector('[name="gender"]:checked'); return (el || {}).value || ''; }
  _emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  _phoneOk(v) { return /^01[0-9]{8,9}$/.test(v.replace(/\D/g, '')); }
  _setErr(field, msg) { const f = document.getElementById('signup-form'); const fg = f && f.querySelector('.fg[data-field="' + field + '"]'); if (!fg) return; fg.classList.add('has-error'); const a = fg.querySelector('.fg-alert'); if (a && msg) a.textContent = msg; }
  _clearFieldErr(field) { const f = document.getElementById('signup-form'); const fg = f && f.querySelector('.fg[data-field="' + field + '"]'); if (fg) fg.classList.remove('has-error'); }
  _validateField(name) {
    let msg = '';
    const v = this._val(name);
    switch (name) {
      case 'name': if (!v) msg = '이름을 입력해 주세요.'; break;
      case 'birth': if (!v) msg = '생년월일을 입력해 주세요.'; break;
      case 'phone':
        if (!v) msg = '연락처를 입력해 주세요.';
        else if (!this._phoneOk(v)) msg = '올바른 연락처 형식을 입력해 주세요. (예: 010-1234-5678)';
        break;
      case 'email':
        if (!v) msg = '이메일을 입력해 주세요.';
        else if (!this._emailOk(v)) msg = '올바른 이메일 형식을 입력해주세요.';
        break;
      case 'userid':
        if (!v) msg = '아이디를 입력해 주세요.';
        else if (this._checkedId !== v) msg = '아이디 중복 확인을 해주세요.';
        break;
      case 'password':
        if (!v) msg = '비밀번호를 입력해 주세요.';
        else if (v.length < 8) msg = '비밀번호는 8자 이상 입력해 주세요.';
        break;
      case 'password2':
        if (!v) msg = '비밀번호를 다시 입력해 주세요.';
        else if (this._val('password') !== v) msg = '비밀번호가 일치하지 않습니다.';
        break;
    }
    if (msg) this._setErr(name, msg); else this._clearFieldErr(name);
    return msg;
  }
  _updatePwStrength(pw) {
    const el = document.getElementById('pw-strength');
    if (!el) return;
    el.classList.remove('show', 'lv1', 'lv2', 'lv3');
    if (!pw) return;
    let s = 0;
    if (pw.length >= 8) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
    if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) s++;
    const level = Math.min(3, Math.max(1, s));
    const labels = { 1: '약함', 2: '보통', 3: '강함' };
    el.classList.add('show', 'lv' + level);
    const lbl = el.querySelector('.pw-label');
    if (lbl) lbl.textContent = '비밀번호 강도 · ' + labels[level];
  }
  _resetVerification() {
    this._phoneVerified = false;
    this._genCode = null;
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    const block = document.getElementById('verify-block'); if (block) block.classList.remove('show');
    const done = document.getElementById('verify-done'); if (done) done.classList.remove('show');
    const btn = document.getElementById('send-code-btn'); if (btn) { btn.textContent = '인증번호 받기'; btn.disabled = false; }
    const vbtn = document.getElementById('verify-btn'); if (vbtn) vbtn.disabled = false;
    const ci = document.querySelector('[name="code"]'); if (ci) { ci.value = ''; ci.disabled = false; }
    const phoneEl = document.querySelector('[name="phone"]'); if (phoneEl) phoneEl.readOnly = false;
  }
  _startTimer() {
    if (this._timer) clearInterval(this._timer);
    let remaining = 180;
    const tEl = document.getElementById('verify-timer');
    const render = () => {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      if (tEl) { tEl.textContent = '남은 시간 ' + m + ':' + s; tEl.classList.remove('expired'); }
    };
    render();
    this._timer = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(this._timer); this._timer = null;
        if (tEl) { tEl.textContent = '인증시간이 만료되었습니다. 재전송해 주세요.'; tEl.classList.add('expired'); }
        const vbtn = document.getElementById('verify-btn'); if (vbtn) vbtn.disabled = true;
        this._genCode = null;
        return;
      }
      render();
    }, 1000);
  }
  _syncAgreeAll() {
    const f = document.getElementById('signup-form'); if (!f) return;
    const boxes = ['agree1', 'agree2', 'agree3'].map((n) => f.querySelector('[name="' + n + '"]'));
    const all = f.querySelector('[name="agreeAll"]');
    if (all) all.checked = boxes.every((b) => b && b.checked);
    this._updateSubmitState();
  }
  _applyAgreeAll(v) {
    const f = document.getElementById('signup-form'); if (!f) return;
    ['agree1', 'agree2', 'agree3'].forEach((n) => { const b = f.querySelector('[name="' + n + '"]'); if (b) b.checked = v; });
    this._updateSubmitState();
  }
  _termsData(key) {
    const data = {
      service: {
        title: '이용약관',
        html: '<h4>제1조 (목적)</h4><p>이 약관은 ㈜이치(이하 "회사")가 제공하는 웹사이트 및 관련 제반 서비스(이하 "서비스")의 이용과 관련하여 회사와 회원 간의 권리·의무 및 책임사항, 이용조건 및 절차 등 기본적인 사항을 규정함을 목적으로 합니다.</p>'
          + '<h4>제2조 (정의)</h4><p>1. "회원"이란 이 약관에 동의하고 회사와 이용계약을 체결하여 서비스를 이용하는 자를 말합니다.<br>2. "아이디(ID)"란 회원의 식별과 서비스 이용을 위하여 회원이 정하고 회사가 승인하는 문자와 숫자의 조합을 말합니다.<br>3. "비밀번호"란 회원의 정보보호를 위하여 회원 자신이 설정한 문자와 숫자의 조합을 말합니다.</p>'
          + '<h4>제3조 (약관의 게시와 개정)</h4><p>1. 회사는 이 약관의 내용을 회원이 쉽게 알 수 있도록 서비스 초기 화면에 게시합니다.<br>2. 회사는 관련 법령을 위배하지 않는 범위에서 이 약관을 개정할 수 있으며, 개정 시 적용일자 및 개정사유를 명시하여 최소 7일 전부터 공지합니다.</p>'
          + '<h4>제4조 (서비스의 제공 및 변경)</h4><p>1. 회사는 회원에게 회사가 정한 서비스를 제공합니다.<br>2. 회사는 서비스의 내용, 운영상·기술상의 필요에 따라 제공하는 서비스의 전부 또는 일부를 변경할 수 있으며, 변경 시 사전에 공지합니다.</p>'
          + '<h4>제5조 (회원의 의무)</h4><p>회원은 관계 법령, 이 약관의 규정, 이용안내 및 서비스와 관련하여 공지한 주의사항을 준수하여야 하며, 회사의 업무를 방해하는 행위를 하여서는 안 됩니다.</p>'
          + '<p class="terms-note">본 약관은 공정거래위원회 표준약관을 참고하여 작성되었으며, 실제 서비스 적용 시 회사 정책에 따라 변경될 수 있습니다.</p>',
      },
      collect: {
        title: '개인정보 수집·이용 동의',
        html: '<p>㈜이치는 회원가입 및 서비스 제공을 위하여 아래와 같이 개인정보를 수집·이용합니다.</p>'
          + '<h4>1. 수집 항목</h4><p>필수항목: 이름, 생년월일, 성별, 연락처(휴대전화번호), 이메일 주소, 아이디, 비밀번호<br>자동수집항목: 접속 IP, 서비스 이용기록, 접속 로그</p>'
          + '<h4>2. 수집·이용 목적</h4><p>회원 식별, 서비스 제공, 고객 문의 응대, 채용 및 현장 운영 관리, 현장 출입 및 배치 업무 지원을 위해 개인정보를 수집·이용합니다.</p>'
          + '<h4>3. 보유 및 이용 기간</h4><p>회원 탈퇴 시까지 보유·이용하며, 탈퇴 시 지체 없이 파기합니다. 다만 관계 법령에 따라 보존할 필요가 있는 경우 해당 기간 동안 보관합니다.</p>'
          + '<h4>4. 동의를 거부할 권리</h4><p>귀하는 개인정보 수집·이용에 대한 동의를 거부할 권리가 있습니다. 다만 필수항목에 대한 동의를 거부하실 경우 회원가입 및 서비스 이용이 제한될 수 있습니다.</p>'
          + '<p class="terms-note">본 동의서는 개인정보보호위원회 표준 서식을 참고하여 작성되었습니다.</p>',
      },
      thirdparty: {
        title: '개인정보 제3자 제공 동의',
        html: '<p>㈜이치는 원활한 서비스 제공을 위하여 아래와 같이 개인정보를 제3자에게 제공합니다.</p>'
          + '<h4>1. 제공받는 자</h4><p>업무 제휴사 및 서비스 운영 협력업체(계약 체결 시 별도 고지)</p>'
          + '<h4>2. 제공 목적</h4><p>서비스 제공 및 운영, 고객 상담·응대, 제휴 서비스 안내 및 이행</p>'
          + '<h4>3. 제공 항목</h4><p>이름, 연락처(휴대전화번호), 이메일 주소</p>'
          + '<h4>4. 보유 및 이용 기간</h4><p>제공 목적 달성 시 또는 회원 탈퇴 시까지 보유하며, 목적 달성 후 지체 없이 파기합니다.</p>'
          + '<h4>5. 동의를 거부할 권리</h4><p>귀하는 개인정보 제3자 제공에 대한 동의를 거부할 권리가 있습니다. 다만 동의를 거부하실 경우 일부 서비스 이용이 제한될 수 있습니다.</p>'
          + '<p class="terms-note">본 동의서는 개인정보보호위원회 표준 서식을 참고하여 작성되었습니다.</p>',
      },
    };
    return data[key];
  }
  _updateSubmitState() {
    const btn = document.getElementById('signup-btn'); if (!btn) return;
    const f = document.getElementById('signup-form');
    const c1 = !!((f && f.querySelector('[name="agree1"]')) || {}).checked;
    const c2 = !!((f && f.querySelector('[name="agree2"]')) || {}).checked;
    const c3 = !!((f && f.querySelector('[name="agree3"]')) || {}).checked;
    const agreed = c1 && c2 && c3;
    const complete = !!this._val('name') && !!this._val('birth') && !!this._gender() &&
      this._phoneOk(this._val('phone')) && this._phoneVerified &&
      this._emailOk(this._val('email')) &&
      !!this._val('userid') && this._checkedId === this._val('userid') &&
      this._val('password').length >= 8 &&
      !!this._val('password2') && this._val('password') === this._val('password2') &&
      agreed;
    btn.disabled = !complete;
    btn.classList.toggle('is-disabled', !complete);
    const helper = document.getElementById('signup-helper'); if (helper) helper.style.display = complete ? 'none' : '';
  }
  renderVals() {
    return {
      openTerms: (e) => {
        const btn = e.currentTarget;
        const key = btn && btn.dataset ? btn.dataset.term : null;
        const data = this._termsData(key);
        if (!data) return;
        this._modalTerm = key;
        const modal = document.getElementById('terms-modal');
        const title = document.getElementById('terms-modal-title');
        const body = document.getElementById('terms-modal-body');
        if (title) title.textContent = data.title;
        if (body) { body.innerHTML = data.html; body.scrollTop = 0; }
        if (modal) modal.classList.add('show');
        document.body.style.overflow = 'hidden';
      },
      closeTerms: () => {
        const modal = document.getElementById('terms-modal');
        if (modal) modal.classList.remove('show');
        document.body.style.overflow = '';
      },
      agreeFromModal: () => {
        const map = { service: 'agree1', collect: 'agree2', thirdparty: 'agree3' };
        const name = map[this._modalTerm];
        const f = document.getElementById('signup-form');
        if (name && f) { const b = f.querySelector('[name="' + name + '"]'); if (b) b.checked = true; }
        this._syncAgreeAll();
        const ta = document.getElementById('agree-alert'); if (ta) ta.classList.remove('show');
        const modal = document.getElementById('terms-modal');
        if (modal) modal.classList.remove('show');
        document.body.style.overflow = '';
      },
      checkId: () => {
        const form = document.getElementById('signup-form');
        if (!form) return;
        const input = form.querySelector('[name="userid"]');
        const msg = document.getElementById('id-check-msg');
        const id = ((input || {}).value || '').trim();
        if (msg) msg.classList.remove('ok', 'taken');
        const taken = ['admin', 'ichi', 'test', 'user', 'manager', 'root', 'guest'];
        if (!id) {
          this._checkedId = null;
          if (msg) { msg.textContent = '아이디를 입력해 주세요.'; msg.classList.add('show', 'taken'); }
          if (input) input.focus({ preventScroll: true });
          this._updateSubmitState();
          return;
        }
        if (taken.includes(id.toLowerCase())) {
          this._checkedId = null;
          if (msg) { msg.textContent = '이미 사용 중인 아이디입니다.'; msg.classList.add('show', 'taken'); }
        } else {
          this._checkedId = id;
          if (msg) { msg.textContent = '사용 가능한 아이디입니다.'; msg.classList.add('show', 'ok'); }
          this._clearFieldErr('userid');
        }
        this._updateSubmitState();
      },
      sendCode: () => {
        const phone = this._val('phone');
        if (!phone) { this._setErr('phone', '연락처를 입력해 주세요.'); const el = document.querySelector('[name="phone"]'); if (el) el.focus({ preventScroll: true }); return; }
        if (!this._phoneOk(phone)) { this._setErr('phone', '올바른 연락처 형식을 입력해 주세요. (예: 010-1234-5678)'); return; }
        this._clearFieldErr('phone');
        this._phoneVerified = false;
        const done = document.getElementById('verify-done'); if (done) done.classList.remove('show');
        this._genCode = String(Math.floor(100000 + Math.random() * 900000));
        const block = document.getElementById('verify-block'); if (block) block.classList.add('show');
        const btn = document.getElementById('send-code-btn'); if (btn) btn.textContent = '재전송';
        const vbtn = document.getElementById('verify-btn'); if (vbtn) vbtn.disabled = false;
        const ci = document.querySelector('[name="code"]'); if (ci) { ci.value = ''; ci.disabled = false; ci.focus({ preventScroll: true }); }
        const hint = document.getElementById('verify-hint'); if (hint) hint.textContent = '데모 인증번호 · ' + this._genCode;
        this._clearFieldErr('code');
        this._startTimer();
        this._updateSubmitState();
      },
      verifyCode: () => {
        const block = document.getElementById('verify-block');
        if (!block || !block.classList.contains('show')) return;
        if (!this._genCode) { this._setErr('code', '인증시간이 만료되었습니다. 재전송해 주세요.'); return; }
        const code = this._val('code');
        if (!code) { this._setErr('code', '인증번호를 입력해 주세요.'); return; }
        if (code !== this._genCode) { this._setErr('code', '인증번호가 일치하지 않습니다.'); return; }
        this._clearFieldErr('code');
        this._phoneVerified = true;
        if (this._timer) { clearInterval(this._timer); this._timer = null; }
        const done = document.getElementById('verify-done'); if (done) done.classList.add('show');
        const vbtn = document.getElementById('verify-btn'); if (vbtn) vbtn.disabled = true;
        const ci = document.querySelector('[name="code"]'); if (ci) ci.disabled = true;
        const sbtn = document.getElementById('send-code-btn'); if (sbtn) sbtn.disabled = true;
        const phoneEl = document.querySelector('[name="phone"]'); if (phoneEl) phoneEl.readOnly = true;
        const tEl = document.getElementById('verify-timer'); if (tEl) { tEl.textContent = ''; tEl.classList.remove('expired'); }
        const hint = document.getElementById('verify-hint'); if (hint) hint.textContent = '';
        this._updateSubmitState();
      },
      onSubmit: (e) => {
        e.preventDefault();
        const form = document.getElementById('signup-form');
        if (!form) return;
        const fields = ['name', 'birth', 'phone', 'email', 'userid', 'password', 'password2'];
        let firstBad = null;
        fields.forEach((n) => { const m = this._validateField(n); if (m && !firstBad) firstBad = form.querySelector('.fg[data-field="' + n + '"] .fi'); });
        if (!this._gender()) { this._setErr('gender', '성별을 선택해 주세요.'); if (!firstBad) firstBad = form.querySelector('[name="gender"]'); } else { this._clearFieldErr('gender'); }
        if (this._phoneOk(this._val('phone')) && !this._phoneVerified) {
          this._setErr('phone', '연락처 인증을 완료해 주세요.');
          if (!firstBad) firstBad = form.querySelector('[name="phone"]');
        }
        const termsAlert = document.getElementById('agree-alert');
        if (termsAlert) termsAlert.classList.remove('show');
        const c1 = !!((form.querySelector('[name="agree1"]')) || {}).checked;
        const c2 = !!((form.querySelector('[name="agree2"]')) || {}).checked;
        const c3 = !!((form.querySelector('[name="agree3"]')) || {}).checked;
        if (!c1 || !c2 || !c3) { if (termsAlert) termsAlert.classList.add('show'); if (!firstBad) firstBad = form.querySelector(!c1 ? '[name="agree1"]' : (!c2 ? '[name="agree2"]' : '[name="agree3"]')); }
        if (firstBad) { firstBad.focus({ preventScroll: true }); return; }
        const note = document.getElementById('signup-note');
        try {
          localStorage.setItem('ichi_profile', JSON.stringify({
            name: this._val('name'), birth: this._val('birth'), gender: this._gender(), phone: this._val('phone'),
            email: this._val('email'), id: this._val('userid'),
            joinDate: new Date().toISOString().slice(0, 10)
          }));
        } catch (err) {}
        if (note) { note.querySelector('span').textContent = '회원가입이 완료되었습니다. 로그인 페이지로 이동합니다…'; note.classList.add('show'); }
        setTimeout(() => { window.location.href = 'login.dc.html'; }, 1500);
      },
    };
  }
}
</script>
</body>
</html>
